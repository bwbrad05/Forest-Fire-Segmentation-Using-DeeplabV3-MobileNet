# Research: Segmentasi Area Kebakaran Hutan dan Lahan pada Citra Satelit
# Menggunakan DeepLabV3+ dengan Backbone MobileViT untuk Wilayah Tropis Indonesia
#
# Default training configuration — Experiment C (primary model: MobileViT-XXS)
name: DeepLabV3Plus-MobileViT
model_name: &model deeplabv3plus_mobilevit_xxs

defaults:
  - _self_
  - model: *model
  - trainer: default_gpu
  - dataset: indonesia
  - logger: comet

mode: train          # train | test | predict | crossval | efficiency | efficiency_sweep | lr_find
ckpt_path: null

# Name this run. When set, logs and checkpoints go to lightning_logs/<run_name>/
# instead of an auto-numbered version_N, which is what makes an ablation sweep
# readable afterwards (scripts/run_ablation.ps1 sets it per variant).
run_name: null

# rich | tqdm | none. Rich draws a live region and shows nothing when stdout is
# not a terminal (pasted multi-line commands, piping to a file); tqdm prints
# plain lines and always shows.
progress_bar: rich
